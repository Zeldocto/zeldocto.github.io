<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="dg3MIVD5MWtS_dPz7vXgh3OFXliq0_4SX26xLNCCejI" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeldocto</title>
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #141414;
            --fg: #d4d4d4;
            --dim: #8a8a8a;
            --faint: #444;
            --accent: #7cc4ff;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            overflow: hidden;
        }

        ::selection { background: var(--accent); color: var(--bg); }

        /* background video + dim overlay */
        .video-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
        .video-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(20, 20, 20, 0.78);
        }
        #intro-video, #loop-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #loop-video { display: none; }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        main {
            position: relative;
            z-index: 2;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.5rem;
            padding: 2rem 1rem;
            animation: fade 0.8s ease-out both;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* title */
        header { text-align: center; user-select: none; }
        header h1 {
            margin: 0;
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 300;
            letter-spacing: -0.04em;
            line-height: 1;
        }
        header h1::after {
            content: '_';
            color: var(--accent);
            animation: blink 1s steps(2) infinite;
        }
        @keyframes blink { to { opacity: 0; } }
        header p { margin: 0.75rem 0 0; color: var(--dim); }
        header p::before { content: '# '; color: var(--faint); }

        /* links */
        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(9rem, max-content));
            justify-content: center;
            gap: 2rem 3.5rem;
            width: 100%;
            max-width: 60rem;
        }
        nav h2 {
            margin: 0 0 0.75rem;
            font-size: inherit;
            font-weight: 500;
            color: var(--accent);
        }
        nav h2::before { content: '// '; color: var(--faint); }
        nav ul { list-style: none; margin: 0; padding: 0; }
        nav li { margin: 0.3rem 0; }
        nav a {
            color: var(--dim);
            text-decoration: none;
            transition: color 0.15s;
        }
        nav a::before {
            content: '> ';
            color: transparent;
            transition: color 0.15s;
        }
        nav a:hover, nav a:focus-visible { color: var(--fg); outline: none; }
        nav a:hover::before, nav a:focus-visible::before { color: var(--accent); }

        /* support prompt */
        .prompt {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 32rem;
            padding: 0.75rem 1rem;
            border: 1px solid var(--faint);
            background: rgba(20, 20, 20, 0.6);
            color: var(--dim);
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }
        .prompt::before { content: '~ $'; color: var(--accent); }
        .prompt:hover, .prompt:focus-visible { border-color: var(--accent); color: var(--fg); outline: none; }

        .loading {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            z-index: 3;
            color: var(--faint);
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="intro-video" autoplay muted preload="auto" playsinline>
            <source src="assets/background/p3rstart.mp4" type="video/mp4">
        </video>
        <video id="loop-video" muted preload="auto" playsinline>
            <source src="assets/background/p3r.mp4" type="video/mp4">
        </video>
    </div>
    <canvas id="dots"></canvas>
    <div class="loading" id="loading">↻</div>

    <main>
        <header>
            <h1>zeldocto</h1>
            <p>super mario sunshine speedrunner</p>
        </header>

        <nav id="links"></nav>

        <a href="https://ko-fi.com/zeldocto" target="_blank" rel="noopener" class="prompt">support me on ko-fi</a>
    </main>

    <script>
        const categories = [
            { title: "profiles", links: [
                ["speedrun.com", "https://speedrun.com/users/Zeldocto"],
                ["pb history", "https://zeldocto.github.io/history"],
                ["start.gg", "https://www.start.gg/user/79bb75cd"],
            ]},
            { title: "tools", links: [
                ["delfino ghosts", "/delfino-ghosts/"],
                ["moonshine customs", "/moonshine-customs/"],
                ["randomizer tracker", "/randotracker/"],
                ["il tool", "/iltool/"],
                ["world calculator", "/worldcalc/"],
            ]},
            { title: "games", links: [
                ["durian clicker", "/durian-clicker/"],
            ]},
            { title: "social", links: [
                ["twitch", "https://twitch.tv/zeldocto"],
                ["youtube", "https://youtube.com/@zeldocto"],
                ["bluesky", "https://bsky.app/profile/zeldocto.bsky.social"],
                ["x", "https://x.com/zeldocto"],
                ["github", "https://github.com/Zeldocto"],
            ]},
        ];

        document.getElementById('links').innerHTML = categories.map(c => `
            <section>
                <h2>${c.title}</h2>
                <ul>${c.links.map(([n, u]) => `<li><a href="${u}"${u.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${n}</a></li>`).join('')}</ul>
            </section>`).join('');

        // video: play intro once, then loop
        const introVideo = document.getElementById('intro-video');
        const loopVideo = document.getElementById('loop-video');
        const loading = document.getElementById('loading');

        loopVideo.load();
        introVideo.addEventListener('canplay', () => { loading.style.display = 'none'; });
        introVideo.addEventListener('ended', () => {
            introVideo.style.display = 'none';
            loopVideo.style.display = 'block';
            loopVideo.loop = true;
            loopVideo.play();
        });

        // dots: each wanders on its own, drifts slightly toward the cursor
        const canvas = document.getElementById('dots');
        const ctx = canvas.getContext('2d');
        const mouse = { x: -1e4, y: -1e4 };
        let dots = [];

        function resize() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            const n = Math.round(innerWidth * innerHeight / 14000);
            dots = Array.from({ length: n }, () => ({
                x: Math.random() * innerWidth,
                y: Math.random() * innerHeight,
                a: Math.random() * Math.PI * 2,   // heading
                s: 0.15 + Math.random() * 0.35,   // speed
                r: 0.8 + Math.random() * 1.2,     // radius
                blue: Math.random() < 0.12,
            }));
        }

        function frame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const d of dots) {
                d.a += (Math.random() - 0.5) * 0.3;            // random wander
                const dx = mouse.x - d.x, dy = mouse.y - d.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 260) {                              // gentle pull to cursor
                    d.x += dx / dist * (1 - dist / 260) * 0.6;
                    d.y += dy / dist * (1 - dist / 260) * 0.6;
                }
                d.x = (d.x + Math.cos(d.a) * d.s + canvas.width) % canvas.width;
                d.y = (d.y + Math.sin(d.a) * d.s + canvas.height) % canvas.height;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = d.blue ? 'rgba(124,196,255,0.6)' : 'rgba(255,255,255,0.25)';
                ctx.fill();
            }
            requestAnimationFrame(frame);
        }

        addEventListener('resize', resize);
        addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        addEventListener('mouseleave', () => { mouse.x = mouse.y = -1e4; });
        resize();
        frame();
    </script>
</body>
</html>
